     fill="white"
     id="rect2169" />
  <style
     id="style2171">
    .title { font: 700 34px Arial, Helvetica, sans-serif; fill:#111; }
    .head  { font: 700 24px Arial, Helvetica, sans-serif; fill:#111; }
    .text  { font: 18px Arial, Helvetica, sans-serif; fill:#222; }
    .small { font: 16px Arial, Helvetica, sans-serif; fill:#333; }
    .box   { fill:#f7f7f7; stroke:#111; stroke-width:3; }
    .inner { fill:white; stroke:#111; stroke-width:3; }
    .link  { fill:none; stroke:#111; stroke-width:4; marker-end:url(#arrow); }
    .i2p   { fill:white; stroke:#111; stroke-width:3; stroke-dasharray:10 7; }
  </style>
  <text
     x="600"
     y="58"
     text-anchor="middle"
     class="title"
     id="text2173">Live 1:1 Communication</text>
  <!-- Alice -->
  <rect
     x="70"
     y="150"
     width="350"
     height="400"
     rx="20"
     class="box"
     id="rect2175" />
  <text
     x="245"
     y="195"
     text-anchor="middle"
     class="head"
     id="text2177">User A</text>
  <text
     x="245"
     y="225"
     text-anchor="middle"
     class="small"
     id="text2179">local application</text>
  <rect
     x="125.17811"
     y="285.1781"
     width="239.64378"
     height="169.21327"
     rx="15.976253"
     class="inner"
     id="rect2181" />
  <text
     x="245"
     y="325"
     text-anchor="middle"
     class="head"
     id="text2183">Peer-B profile</text>
  <text
     x="245"
     y="358"
     text-anchor="middle"
     class="text"
     id="text2185"
     style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:18px;line-height:normal;font-family:Arial, Helvetica, sans-serif"><tspan
       id="tspan13345"
       x="245"
       y="358">dedicated I2P identity</tspan><tspan
       id="tspan13347"
       x="245"
       y="380.5">pinned peer / TOFU</tspan><tspan
       x="245"
       y="403"
       id="tspan13349">independent E2E keys</tspan><tspan
       x="245"
       y="425.5"
       id="tspan13351">offline secret + counters</tspan></text>
  <!-- Bob -->
  <rect
     x="780"
     y="150"
     width="350"
     height="400"
     rx="20"
     class="box"
     id="rect2189" />
  <text
     x="955"
     y="195"
     text-anchor="middle"
     class="head"
     id="text2191">User B</text>
  <text
     x="955"
     y="225"
     text-anchor="middle"
     class="small"
     id="text2193">local application</text>
  <rect
     x="835.17773"
     y="285.1777"
     width="239.64458"
     height="169.13298"
     rx="15.976305"
     class="inner"
     id="rect2195" />
  <text
     x="955"
     y="325"
     text-anchor="middle"
     class="head"
     id="text2197">Peer-A profile</text>
  <text
     x="955"
     y="358"
     text-anchor="middle"
     class="text"
     id="text2199"
     style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:18px;line-height:normal;font-family:Arial, Helvetica, sans-serif"><tspan
       id="tspan14179"
       x="955"
       y="358">dedicated I2P identity</tspan><tspan
       id="tspan14181"
       x="955"
       y="380.5">pinned peer / TOFU</tspan><tspan
       x="955"
       y="403"
       id="tspan14183">independent E2E keys</tspan><tspan
       x="955"
       y="425.5"
       id="tspan14185">offline secret + counters</tspan></text>
  <!-- I2P cloud / transport -->
  <ellipse
     cx="600"
     cy="350"
     rx="120"
     ry="78"
     class="i2p"
     id="ellipse2203" />
  <text
     x="600"
     y="342"
     text-anchor="middle"
     class="head"
     id="text2205"
     style="font-style:normal;font-variant:normal;font-weight:700;font-stretch:normal;font-size:24px;line-height:normal;font-family:Arial, Helvetica, sans-serif">I2P Session</text>
  <text
     x="600"
     y="372"
     text-anchor="middle"
     class="small"
     id="text2207"
     style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:16px;line-height:normal;font-family:Arial, Helvetica, sans-serif"><tspan
       id="tspan14251"
       x="600"
       y="372">I2P transport + app-level E2E</tspan></text>
  <!-- Bidirectional direct session -->
  <path
     d="m 369.90431,330 c 75,-40 89.14318,-54.11566 114.14318,-29.11566"
     class="link"
     id="path2209"
     style="stroke-width:3.7;stroke-dasharray:none;marker-end:url(#TriangleStart)" />
  <path
     d="m 709.82661,392.97918 c 30,25 46.66402,24.99998 111.66402,-13.00002"
     class="link"
     id="path2211"
     style="stroke-width:3.7;stroke-dasharray:none;marker-end:url(#marker9547)" />
  <!-- labels -->
  <text
     x="600"
     y="551"
     text-anchor="middle"
     class="text"
     id="text2213"
     style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:18px;line-height:normal;font-family:Arial, Helvetica, sans-serif">Persistent 1:1 relationship</text>
  <text
     x="600"
     y="576"
     text-anchor="middle"
     class="small"
     id="text2215"
     style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:16px;line-height:normal;font-family:Arial, Helvetica, sans-serif">Each side uses the profile dedicated to the other peer.</text>
  <!-- key architectural note -->
  <rect
     x="170"
     y="600"
     width="860"
     height="70"
     rx="14"
     fill="white"
     stroke="#111"
     stroke-width="2"
     id="rect2217" />
  <text
     x="600"
     y="630"
     text-anchor="middle"
     class="text"
     id="text2219">No shared global user identity is required.</text>
  <text
     x="600"
     y="655"
     text-anchor="middle"
     class="small"
     id="text2221">This relationship remains compartmentalized from every other peer relationship.</text>
