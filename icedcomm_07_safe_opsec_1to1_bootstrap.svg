       markerHeight="6.9999995"
       viewBox="0 0 10.33044 7"
       preserveAspectRatio="xMidYMid">
      <path
         id="tail"
         style="fill:none;fill-rule:evenodd;stroke:context-stroke;stroke-width:1;stroke-linecap:round"
         d="m -3.0000001,-3 -3.1102256,3 3.1102256,3 M -4.0952644e-8,-3 -3.0000001,0 -4.0952644e-8,3 M 3,3 -4.0952644e-8,0 3,-3" />
    </marker>
    <marker
       style="overflow:visible"
       id="Arrow1"
       refX="0"
       refY="0"
       orient="auto-start-reverse"
       markerWidth="4.0606604"
       markerHeight="6.7071066"
       viewBox="0 0 4.0606602 6.7071068"
       preserveAspectRatio="xMidYMid">
      <path
         style="fill:none;stroke:context-stroke;stroke-width:1;stroke-linecap:butt"
         d="M 3,-3 0,0 3,3"
         id="path5057"
         transform="rotate(180,0.125,0)" />
    </marker>
    <marker
       style="overflow:visible"
       id="marker3838"
       refX="0"
       refY="0"
       orient="auto-start-reverse"
       markerWidth="5.3244081"
       markerHeight="6.155385"
       viewBox="0 0 5.3244081 6.1553851"
       preserveAspectRatio="xMidYMid">
      <path
         transform="scale(0.5)"
         style="fill:context-stroke;fill-rule:evenodd;stroke:context-stroke;stroke-width:1pt"
         d="M 5.77,0 -2.88,5 V -5 Z"
         id="path3836" />
    </marker>
    <marker
       style="overflow:visible"
       id="TriangleStart"
       refX="0"
       refY="0"
       orient="auto-start-reverse"
       markerWidth="5.3244081"
       markerHeight="6.155385"
       viewBox="0 0 5.3244081 6.1553851"
       preserveAspectRatio="xMidYMid">
      <path
         transform="scale(0.5)"
         style="fill:context-stroke;fill-rule:evenodd;stroke:context-stroke;stroke-width:1pt"
         d="M 5.77,0 -2.88,5 V -5 Z"
         id="path135" />
    </marker>
    <marker
       id="arrow"
       markerWidth="12"
       markerHeight="12"
       refX="10"
       refY="6"
       orient="auto">
      <path
         d="M 0,0 12,6 0,12 Z"
         fill="#111111"
         id="path3072" />
    </marker>
    <marker
       id="arrowOpen"
       markerWidth="12"
       markerHeight="12"
       refX="10"
       refY="6"
       orient="auto">
      <path
         d="M 1,1 11,6 1,11"
         fill="none"
         stroke="#111111"
         stroke-width="2"
         id="path3075" />
    </marker>
  </defs>
  <rect
     width="1500"
     height="1100"
     fill="white"
     id="rect3080" />
  <style
     id="style3082">
    .title { font: 700 34px Arial, Helvetica, sans-serif; fill:#111; }
    .subtitle { font: 18px Arial, Helvetica, sans-serif; fill:#333; }
    .head { font: 700 22px Arial, Helvetica, sans-serif; fill:#111; }
    .step { font: 700 20px Arial, Helvetica, sans-serif; fill:#111; }
    .text { font: 17px Arial, Helvetica, sans-serif; fill:#222; }
    .small { font: 15px Arial, Helvetica, sans-serif; fill:#333; }
    .panel { fill:#fafafa; stroke:#111; stroke-width:2.5; }
    .peer { fill:white; stroke:#111; stroke-width:2.5; }
    .transient { fill:white; stroke:#111; stroke-width:2.5; stroke-dasharray:9 7; }
    .persistent { fill:white; stroke:#111; stroke-width:3.5; }
    .channel { fill:none; stroke:#111; stroke-width:3.5; marker-end:url(#arrow); }
    .bidir { fill:none; stroke:#111; stroke-width:3; marker-start:url(#arrowOpen); marker-end:url(#arrowOpen); }
    .external { fill:none; stroke:#555; stroke-width:2.5; stroke-dasharray:8 6; marker-end:url(#arrow); }
    .divider { stroke:#999; stroke-width:2; stroke-dasharray:8 8; }
  </style>
  <text
     x="750"
     y="52"
     text-anchor="middle"
     class="title"
     id="text3084">Safe OPSEC Establishment of a Persistent 1:1 Contact</text>
  <text
     x="750"
     y="82"
     text-anchor="middle"
     class="subtitle"
     id="text3086">
    Bootstrap with disposable transient identities; exchange long-term persistent identities only inside the private transient 1:1 session.
  </text>
  <!-- Peer headers -->
  <rect
     x="80"
     y="120"
     width="430"
     height="80"
     rx="16"
     class="panel"
     id="rect3088" />
  <text
     x="295"
     y="155"
     text-anchor="middle"
     class="head"
     id="text3090">Peer A</text>
  <text
     x="295"
     y="180"
     text-anchor="middle"
     class="small"
     id="text3092">independent local client</text>
  <rect
     x="990"
     y="120"
     width="430"
     height="80"
     rx="16"
     class="panel"
     id="rect3094" />
  <text
     x="1205"
     y="155"
     text-anchor="middle"
     class="head"
     id="text3096">Peer B</text>
  <text
     x="1205"
     y="180"
     text-anchor="middle"
     class="small"
     id="text3098">independent local client</text>
  <!-- Step 1 -->
  <text
     x="750"
     y="235"
     text-anchor="middle"
     class="step"
     id="text3100">1. Start in TRANSIENT mode</text>
  <rect
     x="130.75343"
     y="265.75073"
     width="297.22467"
     height="270.67633"
     rx="12.609531"
     class="transient"
     id="rect3102" />
  <text
     x="295"
     y="300"
     text-anchor="middle"
     class="head"
     id="text3104">Transient session A</text>
  <text
     x="295"
     y="330"
     text-anchor="middle"
     class="small"
     id="text3106">temporary I2P identity / b32</text>
  <rect
     x="1075.4336"
     y="265.73831"
     width="293.82523"
     height="270.43506"
     rx="12.465313"
     class="transient"
     id="rect3108" />
  <text
     x="1205"
     y="300"
     text-anchor="middle"
     class="head"
     id="text3110">Transient session B</text>
  <text
     x="1205"
     y="330"
     text-anchor="middle"
     class="small"
     id="text3112">temporary I2P identity / b32</text>
  <!-- external exchange -->
  <rect
     x="590"
     y="250"
     width="320"
     height="120"
     rx="14"
     class="panel"
     id="rect3114" />
  <text
     x="750"
     y="285"
     text-anchor="middle"
     class="head"
     id="text3116">Bootstrap channel</text>
  <text
     x="750"
     y="315"
     text-anchor="middle"
     class="small"
     id="text3118">IRC / XMPP / other private conversation</text>
  <text
     x="750"
     y="342"
     text-anchor="middle"
     class="small"
     id="text3120">may expose transient b32 to a third party</text>
  <path
     d="m 581.2018,309.36771 -102.33541,1.25567"
     class="external"
     id="path3122"
     style="stroke-width:3.7;stroke-dasharray:11.84, 8.88;stroke-dashoffset:0;marker-end:url(#TriangleStart);stroke:#111111;stroke-opacity:1" />
  <path
     d="M 918.42567,310.63242 1020.8722,310"
     class="external"
     id="path3124"
     style="stroke-width:3.7;stroke-dasharray:11.84, 8.88;stroke-dashoffset:0;marker-end:url(#marker3838);stroke:#111111;stroke-opacity:1" />
  <!-- Step 2/3 -->
  <text
     x="750"
     y="420"
     text-anchor="middle"
     class="step"
     id="text3126">2–3. Exchange a transient b32, connect, chat, and establish trust</text>
  <path
     d="M460 470 C620 430,880 430,1040 470"
     class="bidir"
     id="path3128"
     style="marker-end:url(#Arrow1);marker-start:url(#Tail);stroke-width:3.7;stroke-dasharray:none" />
  <text
     x="750"
     y="465"
     text-anchor="middle"
     class="small"
     id="text3130"
     style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:15px;line-height:normal;font-family:Arial, Helvetica, sans-serif">private transient 1:1 session over I2P</text>
  <rect
     x="500"
     y="485"
     width="500"
     height="88"
     rx="14"
     class="panel"
     id="rect3132" />
  <text
     x="750"
     y="518"
     text-anchor="middle"
     class="text"
     id="text3134">Peers communicate privately using unrelated temporary identities</text>
  <text
     x="750"
     y="545"
     text-anchor="middle"
     class="small"
     id="text3136">They decide to upgrade to persistent profiles with offline functionality</text>
  <!-- trust boundary -->
  <line
     x1="80"
     y1="610"
     x2="1420"
     y2="610"
     class="divider"
     id="line3138" />
  <text
     x="750"
     y="600"
     text-anchor="middle"
     class="small"
     id="text3140">From this point onward, long-term identity material is exchanged only inside the private transient 1:1 session</text>
  <!-- Step 4 -->
  <text
     x="750"
     y="655"
     text-anchor="middle"
     class="step"
     id="text3142">4. Start PERSISTENT profiles and exchange persistent b32 addresses inside the transient session</text>
  <rect
     x="130"
     y="690"
     width="330"
     height="105"
     rx="14"
     class="persistent"
     id="rect3144" />
  <text
     x="295"
     y="725"
     text-anchor="middle"
     class="head"
     id="text3146">Persistent profile A</text>
  <text
     x="295"
     y="754"
     text-anchor="middle"
     class="small"
     id="text3148">long-term b32 + offline state</text>
  <text
     x="295"
     y="778"
     text-anchor="middle"
     class="small"
     id="text3150">never sent over bootstrap channel</text>
  <rect
     x="1040"
     y="690"
     width="330"
     height="105"
     rx="14"
     class="persistent"
     id="rect3152" />
  <text
     x="1205"
     y="725"
     text-anchor="middle"
     class="head"
     id="text3154">Persistent profile B</text>
  <text
     x="1205"
     y="754"
     text-anchor="middle"
     class="small"
     id="text3156">long-term b32 + offline state</text>
  <text
     x="1205"
     y="778"
     text-anchor="middle"
     class="small"
     id="text3158">never sent over bootstrap channel</text>
  <path
     d="m 482,742 c 150,-47 396,-47 546,0"
     class="bidir"
     id="path3160"
     style="stroke-width:3.7;stroke-dasharray:none;marker-start:url(#Tail);marker-end:url(#marker4604)" />
  <text
     x="750"
     y="770"
     text-anchor="middle"
     class="small"
     id="text3162"
     style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:15px;line-height:normal;font-family:Arial, Helvetica, sans-serif">persistent b32 exchange occurs inside the already-private transient channel</text>
  <!-- Step 5 -->
  <text
     x="750"
     y="845"
     text-anchor="middle"
     class="step"
     id="text3164">5. Connect in PERSISTENT mode, verify identities, then lock profiles</text>
  <path
     d="M460 885 C620 850,880 850,1040 885"
     class="bidir"
     id="path3166"
     style="stroke-width:3.7;stroke-dasharray:none;marker-start:url(#Tail);marker-end:url(#marker5050)" />
  <text
     x="750"
     y="885"
     text-anchor="middle"
     class="small"
     id="text3168"
     style="font-style:normal;font-variant:normal;font-weight:normal;font-stretch:normal;font-size:15px;line-height:normal;font-family:Arial, Helvetica, sans-serif">direct persistent 1:1 connection over I2P</text>
  <rect
     x="500"
     y="900"
     width="500"
     height="78"
     rx="14"
     class="panel"
     id="rect3170" />
  <text
     x="750"
     y="931"
     text-anchor="middle"
     class="text"
     id="text3172">Verify persistent peer identity / TOFU</text>
  <text
     x="750"
     y="957"
     text-anchor="middle"
     class="small"
     id="text3174">then lock the profiles so later identity mismatch is rejected</text>
  <!-- Step 6 -->
  <text
     x="750"
     y="1020"
     text-anchor="middle"
     class="step"
     id="text3176">6. Close and discard transient sessions</text>
  <text
     x="295"
     y="1052"
     text-anchor="middle"
     class="small"
     id="text3178">Transient A: discarded</text>
  <text
     x="1205"
     y="1052"
     text-anchor="middle"
     class="small"
     id="text3180">Transient B: discarded</text>
  <rect
     x="380"
     y="1065"
     width="740"
     height="26"
     rx="8"
     fill="white"
     stroke="#111"
     stroke-width="1.8"
     id="rect3182" />
  <text
     x="750"
     y="1083"
     text-anchor="middle"
     class="small"
     id="text3184">
    Long-term persistent addresses were never exposed outside the transient private 1:1 session.
  </text>
</svg>
