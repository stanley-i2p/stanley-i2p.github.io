  <!-- architectural annotations -->
  <text
     x="667.5"
     y="625"
     text-anchor="middle"
     class="text"
     id="text2431">Servers are untrusted storage, not participants in the relationship.</text>
  <text
     x="667.5"
     y="652"
     text-anchor="middle"
     class="small"
     id="text2433">No chat identity, contact graph, group state, or readable message content is required at the deaddrop.</text>
